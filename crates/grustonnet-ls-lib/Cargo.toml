[package]
name = "grustonnet-ls-lib"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
tracing = ["tracy-client"]

[dependencies]
anyhow = "1.0.98"
lazy_static = "1.5.0"
lsp-server = "0.7.8"
lsp-types = { version = "0.97.0", features = ["proposed"] }
rust2go = { version = "0.4.0" }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "net"] }
name-variant = { path = "../name-variant"}
jsonnet-bridge = { path = "../jsonnet-bridge"}
jsonnet-location = { path = "../jsonnet-location"}
jsonnet-cst = { path = "../jsonnet-cst"}
grustonnet-node = { path = "../grustonnet-node"}
grustonnet-config = { path = "../grustonnet-config"}
language-server = { path = "../language-server"}
utils = { path = "../utils"}
paste = "1.0.15"
ropey = "1.6.1"
regex = "1.11.1"
tree-sitter = "0.25.10"
tree-sitter-jsonnet = {git = "https://github.com/koskev/tree-sitter-jsonnet"}
pretty_assertions = "1.4.1"
env_logger = "0.11.8"
log = "0.4.27"
smart-default = "0.7.1"
schemars = "1.0.1"
similar = "2.7.0"
jsonnet-std-docs = { path = "../jsonnet-std-docs"}
bevy_tasks = { version = "0.16.1", features = ["multi_threaded"] }
test-macros = { path = "../test-macros"}
strum = { version = "0.27.1", features = ["derive", "strum_macros"] }
walkdir = "2.5.0"
itertools = "0.14.0"
rayon = "1.10.0"
tracy-client = { version= "0.18.2", optional = true }
thiserror = "2.0.12"
rmp-serde = "1.3.0"
bincode = "2.0.1"
assert_unordered = "0.3.5"
semver = "1.0.27"
fallible-iterator = "0.3.0"

[build-dependencies]
reqwest = { version = "0.12.20", features = ["blocking", "rustls-tls"], default-features = false }
jsonnet-bridge = { path = "../jsonnet-bridge"}
jsonnet-std-docs = { path = "../jsonnet-std-docs"}
htmd = "0.2.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
rmp-serde = "1.3.0"
