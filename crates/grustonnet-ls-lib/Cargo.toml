[package]
name = "grustonnet-ls-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
lazy_static = "1.5.0"
lsp-server = "0.7.8"
lsp-types = { version = "0.97.0", features = ["proposed"] }
rust2go = { version = "0.4.0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "net"] }
name-variant = { path = "../name-variant"}
jsonnet-bridge = { path = "../jsonnet-bridge"}
language-server = { path = "../language-server"}
paste = "1.0.15"
ropey = "1.6.1"
regex = "1.11.1"
tree-sitter = "0.22.6"
tree-sitter-jsonnet = {git = "https://github.com/sourcegraph/tree-sitter-jsonnet"}
pretty_assertions = "1.4.1"
env_logger = "0.11.8"
log = "0.4.27"
smart-default = "0.7.1"
schemars = "1.0.1"
similar = "2.7.0"
jsonnet-std-docs = { path = "../jsonnet-std-docs"}
bevy_tasks = { version = "0.16.1", features = ["multi_threaded"] }

[build-dependencies]
reqwest = { version = "0.12.20", features = ["blocking"] }
jsonnet-bridge = { path = "../jsonnet-bridge"}
jsonnet-std-docs = { path = "../jsonnet-std-docs"}
htmd = "0.2.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
