[package]
name = "language-server"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.98"
lsp-server = "0.7.8"
lsp-types = { version = "0.97.0", features = ["proposed"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
pretty_assertions = "1.4.1"
log = "0.4.27"
ropey = "1.6.1"
similar = "2.7.0"
tree-sitter = ">=0.22.6"
crossbeam.workspace = true
rand = "0.10.0"
mockall = "0.14.0"
utils = { path = "../utils"}
url = "2.5.8"
rayon.workspace = true
