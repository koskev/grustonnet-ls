[package]
name = "grustonnet-debugger"
version = "0.1.0"
edition = "2024"
default-run = "grustonnet-debugger"

[lints]
workspace = true


[dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
env_logger = { workspace = true }
grustonnet-node = { path = "../grustonnet-node"}
jsonnet-location = { path = "../jsonnet-location"}
rust2go-env = { path = "../rust2go-env"}
rust-dap = { path = "../rust-dap"}
clap = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
jsonnet-bridge = { path = "../jsonnet-bridge"}
bincode-next = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
anyhow.workspace = true
log = { workspace = true }
rayon = { workspace = true }
utils = { path = "../utils"}
crossbeam.workspace = true

[target.'cfg(unix)'.dependencies]
exec = { version = "0.3.1" }

[[bin]]
name = "grustonnet-debugger"
path = "src/main.rs"
