[package]
name = "grustonnet-debugger"
version = "0.1.0"
edition = "2024"
default-run = "grustonnet-debugger"

[lints]
workspace = true


[dependencies]
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "net"] }
env_logger = "0.11.8"
grustonnet-ls-lib = { path = "../grustonnet-ls-lib"}
grustonnet-config = { path = "../grustonnet-config"}
grustonnet-node = { path = "../grustonnet-node"}
language-server = { path = "../language-server"}
jsonnet-location = { path = "../jsonnet-location"}
rust2go-env = { path = "../rust2go-env"}
rust-dap = { path = "../rust-dap"}
schemars = "1.0.1"
clap = { version = "4.5.40", features = ["derive"] }
serde_json = "1.0.140"
tracy-client = { version = "0.18.2", optional = true }
jsonnet-bridge = { path = "../jsonnet-bridge"}
bincode = "2.0.1"
serde = { version = "1.0.219", features = ["derive", "rc"] }
anyhow.workspace = true
log = "0.4.27"
rayon = "1.10.0"
utils = { path = "../utils"}
crossbeam.workspace = true

[target.'cfg(unix)'.dependencies]
exec = { version = "0.3.1" }

[[bin]]
name = "grustonnet-debugger"
path = "src/main.rs"
