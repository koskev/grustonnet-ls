[package]
name = "grustonnet-lint"
edition = "2024"

[lints]
workspace = true

[features]
tracing = ["tracy-client", "grustonnet-ls-lib/tracing"]

[dependencies]
anyhow = "1.0.98"
rust2go-env = { path = "../rust2go-env"}
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "net"] }
env_logger = "0.11.8"
grustonnet-ls-lib = { path = "../grustonnet-ls-lib"}
language-server = { path = "../language-server"}
utils = { path = "../utils"}
clap = { version = "4.5.40", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.140"
tracy-client = { version = "0.18.2", optional = true }
lsp-types = { version = "0.97.0", features = ["proposed"] }
miette = { version = "7.6.0", features = ["fancy"] }
ropey = "1.6.1"
glob = "0.3.3"
[target.'cfg(unix)'.dependencies]
exec = { version = "0.3.1" }

[[bin]]
name = "grustonnet-lint"
path = "src/main.rs"
