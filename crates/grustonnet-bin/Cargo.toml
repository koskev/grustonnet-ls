[package]
name = "grustonnet-bin"
version = "0.0.0"
edition = "2024"
default-run = "grustonnet-ls"

[lints]
workspace = true

[features]
tracing = ["tracy-client", "grustonnet-ls-lib/tracing"]

[dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
env_logger = { workspace = true }
grustonnet-ls-lib = { path = "../grustonnet-ls-lib"}
grustonnet-config = { path = "../grustonnet-config"}
language-server = { path = "../language-server"}
rust2go-env = { path = "../rust2go-env"}
version-macros = { path = "../version-macros"}
schemars = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracy-client = { workspace = true, optional = true }
[target.'cfg(unix)'.dependencies]
exec = { version = "0.3.1" }

[[bin]]
name = "grustonnet-ls"
path = "src/main.rs"
