# (typically under flake.actions-nix.workflows.".github/workflows/release.yaml") and run:
#   nix run .#render-workflows
# Or commit to trigger the pre-commit hook if enabled.
jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
    - name: checkout full
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        fetch-depth: 0
    - env:
        OUTPUT: CHANGELOG.md
      name: Generate a changelog
      uses: orhun/git-cliff-action@c93ef52f3d0ddcdcc9bd5447d98d458a11cd4f72
      with:
        args: --verbose --current
        config: cliff.toml
    - name: Upload changelog
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: changelog
        path: CHANGELOG.md
        retention-days: 1
  release:
    needs:
    - changelog
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
    - name: checkout
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
    - name: Generate Version
      run: |-
        GITHUB_TAG_NAME=${{ github.ref_name }}
        TAG_NAME=${GITHUB_TAG_NAME:-v0.0.0}
        TAG_VERSION=${TAG_NAME: 1}
        echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV
    - name: Generate output name
      run: |-
        RELEASE_TAR=$(echo "grustonnet_${{ matrix.platform.os-name }}.tar.gz" | tr '[:upper:]' '[:lower:]' | tr '-' '_')
        echo ${RELEASE_TAR}
        echo "RELEASE_TAR=${RELEASE_TAR}" >> $GITHUB_ENV
    - name: Set Cargo Version
      run: |-
        # TODO: Suffix handling (e.g. -RC1)
        cargo install cargo-set-version
        echo "Setting program version to ${TAG_VERSION}"
        cargo set-version ${TAG_VERSION}
    - name: Get changelog
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: changelog
        path: changelog
    - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
      with:
        go-version: '1.25'
    - if: ${{ contains(matrix.platform.target, 'windows') && contains(matrix.platform.runs-on,
        'ubuntu') }}
      name: Install cross compile tools
      run: sudo apt update && sudo apt install gcc-mingw-w64 && rustup target add
        x86_64-pc-windows-gnu
    - env:
        GODEBUG: invalidptr=0,cgocheck=0
        RUST_BACKTRACE: 1
      name: Build binary
      run: make build-${{ matrix.platform.target }}
    - name: Compress binary
      run: |-
        #!/usr/bin/env bash
        tmpdir=$(mktemp -d)
        # Mac is stupid so we can't use transform in tar nor -executable in find
        find ./ -type f -perm -111 -iname "grustonnet-*" -exec cp {} "$tmpdir/" \;
        # Stupid but makes sure it works everywhere
        pushd "$tmpdir" || exit 1
        tar -czf "$RELEASE_TAR" ./*
        popd || exit 1
        mv "$tmpdir"/"$RELEASE_TAR" ./
        rm -rf "$tmpdir"
    - name: Publish artifacts and release
      uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
      with:
        body_path: changelog/CHANGELOG.md
        files: ${{ env.RELEASE_TAR }}
    strategy:
      matrix:
        platform:
        - os-name: Linux-x86_64
          runs-on: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
        - os-name: Linux-aarch64
          runs-on: ubuntu-24.04-arm
          target: aarch64-unknown-linux-gnu
        - os-name: macOS-aarch64
          runs-on: macos-latest
          target: aarch64-apple-darwin
        - os-name: Windows-x86_64
          runs-on: ubuntu-24.04
          target: x86_64-pc-windows-gnu
'on':
  push:
    tags:
    - v*
  workflow_dispatch: {}
