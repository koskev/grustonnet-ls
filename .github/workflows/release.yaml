on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md
          retention-days: 1
  release:
    name: Release - ${{ matrix.platform.os-name }}
    strategy:
      matrix:
        platform:
          - os-name: Linux-x86_64
            runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

          # XXX: Since windows is such a bad system, we just cross compile it from Linux
          - os-name: Windows-x86_64
            runs-on: ubuntu-24.04
            target: x86_64-pc-windows-gnu

          - os-name: macOS-arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform.runs-on }}
    needs: changelog
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: changelog
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Install cross compile tools
        if: ${{ contains(matrix.platform.target, 'windows') && contains(matrix.platform.runs-on, 'ubuntu') }}
        run: sudo apt update && sudo apt install gcc-mingw-w64 && rustup target add x86_64-pc-windows-gnu
      - name: Build binary
        run: cargo build --release --target ${{ matrix.platform.target }}
        env:
          RUST_BACKTRACE: 1
          GODEBUG: "invalidptr=0,cgocheck=0"
      # TODO: Replace AI action
      - name: Publish artifacts and release
        uses: houseabsolute/actions-rust-release@v0
        with:
          executable-name: grustonnet-ls${{ contains(matrix.platform.target, 'windows') && '.exe' || ''}}
          target: ${{ matrix.platform.target }}
          changes-file: changelog/CHANGELOG.md
