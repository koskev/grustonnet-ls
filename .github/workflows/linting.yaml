name: Linting
on:
  push:
  pull_request:
jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # Use nix to have a known rust version
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - run: nix develop .#clippy --command make clippy
