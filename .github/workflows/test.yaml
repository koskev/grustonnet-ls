name: Test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    strategy:
      matrix:
        platform:
          - os-name: Linux-x86_64
            runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

          # XXX: Since windows is such a bad system, we just cross compile it from Linux and use wine
          - os-name: Windows-x86_64
            runs-on: ubuntu-24.04
            target: x86_64-pc-windows-gnu

          - os-name: macOS-arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform.runs-on }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v6
      with:
        go-version: '1.25'
    - name: Run tests
      run: cargo test --verbose
      if: ${{ !contains(matrix.platform.target, 'windows') }}
      env:
        GODEBUG: "invalidptr=0,cgocheck=0"
        RUST_BACKTRACE: 1
    - name: Test Windows x86_64 GNU
      uses: Reloaded-Project/devops-rust-test-in-latest-wine@v1
      if: ${{ contains(matrix.platform.target, 'windows') }}
      env:
        RUSTFLAGS: ""
      with:
        rust-project-path: '.'
        target: 'x86_64-pc-windows-gnu'
