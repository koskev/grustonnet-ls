env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  build:
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
    - name: checkout full
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        password: ${{ secrets.GITHUB_TOKEN }}
        registry: ghcr.io
        username: ${{ github.repository_owner }}
    - name: Build and push image
      run: |-
        TAG="${GITHUB_REF_NAME//\//-}"
        nix run ".#dockerImageFull.copyTo" -- "docker://${{ env.IMAGE }}:$TAG-${{ matrix.platform.target }}"
    strategy:
      matrix:
        platform:
        - os-name: Linux-x86_64
          runs-on: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
        - os-name: Linux-aarch64
          runs-on: ubuntu-24.04-arm
          target: aarch64-unknown-linux-gnu
  manifest:
    needs:
    - build
    runs-on: ubuntu-latest
    steps:
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        password: ${{ secrets.GITHUB_TOKEN }}
        registry: ghcr.io
        username: ${{ github.repository_owner }}
    - name: Make manifest
      run: |-
        TAG="${GITHUB_REF_NAME//\//-}"
        docker manifest create "${{ env.IMAGE }}:${TAG}" ${{ env.IMAGE }}:$TAG-x86_64-unknown-linux-gnu ${{ env.IMAGE }}:$TAG-aarch64-unknown-linux-gnu
        docker manifest push "${{ env.IMAGE }}:${TAG}"
name: Publish docker image
'on':
  push:
    tags:
    - '*'
