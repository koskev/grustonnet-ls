jobs:
  build:
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
    - name: checkout full
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        fetch-depth: 0
