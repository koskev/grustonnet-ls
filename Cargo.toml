[package]
name = "grustonnet-ls"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
anyhow = "1.0.98"
lazy_static = "1.5.0"
lsp-server = "0.7.8"
lsp-types = "0.97.0"
rust2go = { version = "0.4.0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "net"] }
name-variant = { path = "./crates/name-variant"}
paste = "1.0.15"
ropey = "1.6.1"

[build-dependencies]
rust2go = { version = "0.4.0", features = ["build"] }
